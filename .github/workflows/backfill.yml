name: Backfill archive

on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months back"
        default: "12"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill
        run: python scripts/backfill.py "${{ github.event.inputs.months || '12' }}"
      - name: Commit archive
        run: |
          git config user.name "medchem-asap bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/archive
          git diff --cached --quiet || git commit -m "Backfill archive"
          git pull --rebase -X theirs && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
